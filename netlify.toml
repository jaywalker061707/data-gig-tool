[build]
  base    = "frontend"
  command = "npm run build"
  publish = "dist"

# Proxy all /api/* calls to Lambda — browser never makes a cross-origin request
# No CORS issues. Lambda returns job_id immediately so no timeout risk.
[[redirects]]
  from   = "/api/*"
  to     = "https://ltawkbobo7r4ws3kel3g2ne3su0nfjxf.lambda-url.us-east-1.on.aws/api/:splat"
  status = 200
  force  = true

  [redirects.headers]
    X-Forwarded-Host = "data-integrity-tool.netlify.app"
